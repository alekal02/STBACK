<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Segtrack · relatório</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --fundo:#f4f1ea; --papel:#fffdf8; --tinta:#1c2430; --muted:#5c6b7a; --linha:#e4ddd0; --verde:#1f7a4d; --ambar:#a56b00; --vermelho:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 "Segoe UI", sans-serif; color:var(--tinta); background:var(--fundo); }
    header { position:sticky; top:0; z-index:20; display:flex; gap:12px; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--papel); border-bottom:1px solid var(--linha); }
    h1 { font-size:18px; margin:0; }
    p { margin:2px 0 0; color:var(--muted); font-size:12px; }
    button, a.btn { border:0; background:var(--tinta); color:#fff; border-radius:8px; padding:10px 14px; font:inherit; text-decoration:none; cursor:pointer; }
    button.sec { background:transparent; color:var(--tinta); border:1px solid var(--linha); }
    button:disabled { opacity:.6; cursor:wait; }
    .acoes { display:flex; gap:8px; flex-wrap:wrap; }
    main { max-width:920px; margin:0 auto; padding:16px; display:grid; gap:12px; }
    .cartao { background:var(--papel); border:1px solid var(--linha); border-radius:12px; padding:14px; }
    .nums { display:flex; gap:8px; flex-wrap:wrap; }
    .nums b { display:block; font-size:22px; }
    .nums span { font-size:12px; color:var(--muted); }
    .nums div { flex:1; min-width:90px; }
    .feita b { color:var(--verde); } .parcial b { color:var(--ambar); } .nao b { color:var(--vermelho); }
    .linha { display:grid; grid-template-columns:72px 1fr auto; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--linha); cursor:pointer; }
    .linha strong { font-size:14px; }
    .linha small { color:var(--muted); }
    .barra { height:8px; border-radius:99px; background:#f3d6d3; overflow:hidden; margin-top:6px; }
    .barra i { display:block; height:100%; background:var(--verde); }
    .texto p { margin:0 0 8px; }
    #mapa { height:min(62vh, 480px); border-radius:12px; display:none; border:1px solid var(--linha); }
    .aviso { color:var(--muted); font-size:13px; }
    .legenda { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
    .legenda i { display:inline-block; width:18px; height:4px; margin-right:4px; vertical-align:middle; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="titulo">Segtrack</h1>
      <p id="sub">Abrindo o relatório…</p>
    </div>
    <div class="acoes">
      <button id="baixar" class="sec" type="button" hidden>Baixar PDF</button>
    </div>
  </header>
  <main>
    <section class="cartao nums" id="nums" hidden></section>
    <section class="cartao texto" id="texto"></section>
    <section class="cartao" id="lista" hidden></section>
    <div id="mapa"></div>
    <p class="legenda" id="legenda" hidden>
      <span id="leg-trajeto"><i style="background:#1d4e89"></i>trajeto do caminhão</span>
      <span id="leg-feito" hidden><i style="background:#1f7a4d"></i>via executada</span>
      <span id="leg-aberto" hidden><i style="background:#b42318"></i>em aberto</span>
    </p>
    <p class="aviso" id="aviso"></p>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const token = location.pathname.split("/").filter(Boolean).pop();
    const api = "/api/r/" + token;
    const titulo = document.getElementById("titulo");
    const sub = document.getElementById("sub");
    const nums = document.getElementById("nums");
    const texto = document.getElementById("texto");
    const lista = document.getElementById("lista");
    const aviso = document.getElementById("aviso");
    const baixar = document.getElementById("baixar");
    const mapaEl = document.getElementById("mapa");
    const legenda = document.getElementById("legenda");
    let mapa = null;
    let camada = null;
    let rel = null;
    let basePronta = false;
    const t0 = performance.now();

    function hora(iso) {
      const s = String(iso || "");
      return s.length >= 16 ? s.slice(11, 16) : "";
    }
    function pct(n) {
      const v = Number(n || 0);
      return v.toFixed(1).replace(".", ",") + "%";
    }
    function cor(situacao) {
      if (situacao === "Feita") return "var(--verde)";
      if (situacao === "Parcial") return "var(--ambar)";
      return "var(--vermelho)";
    }
    function escapar(s) {
      return String(s || "").replace(/[&<>]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
    }

    function garantirMapa(mapboxToken) {
      if (mapa) return;
      mapa = L.map(mapaEl, { attributionControl: false, zoomControl: true });
      L.control.attribution({ prefix: false }).addTo(mapa);
      if (mapboxToken) {
        L.tileLayer(
          "https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}?access_token=" + encodeURIComponent(mapboxToken),
          {
            attribution: "&copy; Mapbox &copy; OpenStreetMap",
            tileSize: 512,
            zoomOffset: -1,
            maxZoom: 22,
          }
        ).addTo(mapa);
      } else {
        L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap",
          maxZoom: 19,
          subdomains: "abc",
        }).addTo(mapa);
      }
      camada = L.layerGroup().addTo(mapa);
      basePronta = true;
    }

    async function abrirMapa(codigo) {
      mapaEl.style.display = "block";
      legenda.hidden = false;
      const r = await fetch(api + "/mapa?codigo=" + encodeURIComponent(codigo));
      const corpo = await r.json();
      garantirMapa(corpo.mapbox_token || "");
      camada.clearLayers();
      const grupo = [];
      (corpo.poligonos || []).forEach((anel) => {
        if (anel.length < 3) return;
        const poly = L.polygon(anel, { color: "#8a6a12", weight: 2, fillOpacity: 0.06 });
        camada.addLayer(poly);
        grupo.push(poly);
      });
      (corpo.abertas || []).forEach((linha) => {
        const traco = L.polyline(linha, { color: "#b42318", weight: 3, opacity: 0.75 });
        camada.addLayer(traco);
        grupo.push(traco);
      });
      (corpo.feitos || []).forEach((linha) => {
        const traco = L.polyline(linha, { color: "#1f7a4d", weight: 3, opacity: 0.7 });
        camada.addLayer(traco);
        grupo.push(traco);
      });
      document.getElementById("leg-aberto").hidden = !(corpo.abertas || []).length;
      document.getElementById("leg-feito").hidden = !(corpo.feitos || []).length;
      const traj = corpo.trajetos || [];
      traj.forEach((item) => {
        const corLinha = item.cor || "#1d4e89";
        (item.tracos || []).forEach((linha) => {
          const traco = L.polyline(linha, { color: "#fff", weight: 7, opacity: 0.85 });
          camada.addLayer(traco);
          const traco2 = L.polyline(linha, { color: corLinha, weight: 4, opacity: 0.98 });
          camada.addLayer(traco2);
          grupo.push(traco2);
        });
      });
      if (grupo.length) mapa.fitBounds(L.featureGroup(grupo).getBounds(), { padding: [18, 18] });
      setTimeout(() => mapa.invalidateSize(), 80);
      const plac = traj.map((t) => t.placa).filter(Boolean);
      aviso.textContent = plac.length
        ? (corpo.codigo + " · " + (corpo.nome || "") + " · trajeto: " + plac.join(", "))
        : (corpo.codigo + " · " + (corpo.nome || "") + " · sem trajeto GPS nesta rota");
    }

    async function baixarPdf(tentativa) {
      baixar.disabled = true;
      baixar.textContent = "Montando PDF…";
      let seguir = false;
      try {
        const r = await fetch(api + "/pdf");
        if (r.status === 202 || r.status === 502 || r.status === 503) {
          aviso.textContent = "PDF em montagem. Nova tentativa em alguns segundos.";
          if (tentativa < 40) {
            seguir = true;
            setTimeout(() => baixarPdf(tentativa + 1), 5000);
            return;
          }
          aviso.textContent = "O PDF ainda está sendo montado. Toque de novo em um minuto.";
          return;
        }
        if (r.status === 410) {
          aviso.textContent = "Este link expirou. Peça frota de novo no grupo.";
          return;
        }
        if (!r.ok) {
          aviso.textContent = "Não consegui baixar o PDF agora.";
          return;
        }
        const blob = await r.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (rel && rel.tipo ? rel.tipo : "relatorio") + ".pdf";
        a.click();
        aviso.textContent = "PDF baixado.";
      } catch (err) {
        aviso.textContent = "Não consegui baixar o PDF agora.";
      } finally {
        if (!seguir) {
          baixar.disabled = false;
          baixar.textContent = "Baixar PDF";
        }
      }
    }
    baixar.onclick = () => baixarPdf(0);

    fetch(api).then(async (r) => {
      if (!r.ok) {
        titulo.textContent = "Link encerrado";
        sub.textContent = "Peça o relatório de novo no grupo.";
        return;
      }
      rel = await r.json();
      const dia = (rel.data || "").split("-").reverse().join("/");
      titulo.textContent = rel.titulo || "Relatório";
      const corte = hora(rel.congelado_em);
      const expira = new Date((rel.expira || 0) * 1000);
      const expTxt = isNaN(expira.getTime()) ? "" : " · link até " + expira.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      sub.textContent = dia + (corte ? " · pulsos até " + corte : "") + expTxt + " · aberto em " + Math.max(0.1, (performance.now() - t0) / 1000).toFixed(1).replace(".", ",") + "s";
      texto.innerHTML = (rel.texto || []).map((linha) => "<p>" + escapar(linha) + "</p>").join("");
      const balanco = rel.balanco || [];
      baixar.hidden = false;
      if (balanco.length) {
        const feitas = balanco.filter((row) => row.situacao === "Feita").length;
        const parciais = balanco.filter((row) => row.situacao === "Parcial").length;
        const nao = balanco.filter((row) => row.situacao === "Não feita").length;
        nums.hidden = false;
        nums.innerHTML = "<div class='feita'><b>" + feitas + "</b><span>feitas</span></div><div class='parcial'><b>" + parciais + "</b><span>parciais</span></div><div class='nao'><b>" + nao + "</b><span>não feitas</span></div>";
        lista.hidden = false;
        lista.innerHTML = balanco.map((row) => {
          const largura = Math.max(0, Math.min(100, Number(row.percentual || 0)));
          return "<div class='linha' data-codigo='" + escapar(row.codigo) + "'><strong>" + escapar(row.codigo) + "</strong><div><div>" + escapar(row.nome) + " · " + escapar(row.situacao) + "</div><div class='barra'><i style='width:" + largura + "%;background:" + cor(row.situacao) + "'></i></div></div><small>" + pct(row.percentual) + "</small></div>";
        }).join("");
        lista.querySelectorAll(".linha").forEach((el) => {
          el.onclick = () => abrirMapa(el.getAttribute("data-codigo"));
        });
        aviso.textContent = "Toque numa rota para ver o trajeto no mapa. O PDF é opcional no botão acima.";
      } else if ((rel.codigos || []).length) {
        abrirMapa(rel.codigos[0]);
      } else if (rel.consulta) {
        abrirMapa(rel.consulta);
      }
    }).catch(() => {
      titulo.textContent = "Sem conexão";
      sub.textContent = "Abra o link de novo.";
    });
  </script>
</body>
</html>
